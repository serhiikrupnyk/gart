services:
  postgres:
    image: postgres:16
    container_name: gart_postgres
    restart: unless-stopped
    environment:
      # POSTGRES_DB stays `postgres` on purpose: had the entrypoint created the
      # application database, it would be owned by the superuser, and on PG15+ the
      # app role could not create tables in its public schema. The init script
      # creates it owned by the app role instead.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      GART_DB: ${GART_DB:-gart}
      GART_DB_SHADOW: ${GART_DB_SHADOW:-gart_shadow}
      GART_DB_TEST: ${GART_DB_TEST:-gart_test}
      GART_DB_USER: ${GART_DB_USER:-gart_app}
      GART_DB_PASSWORD: ${GART_DB_PASSWORD:?set GART_DB_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - gart_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12

  # S3-compatible object storage for exercise media (dev). Private bucket; the
  # API serves media only through short-lived presigned URLs. In production any
  # S3-compatible provider works — ideally an egress-free one (R2/B2-class),
  # since egress, not storage, is where video costs live.
  minio:
    image: minio/minio:latest
    container_name: gart_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gart_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - '${MINIO_PORT:-19000}:9000'
      - '${MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - gart_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: creates the private media bucket, then exits. No anonymous
  # access policy is ever attached — private is the default and stays so.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set local http://minio:9000
        '${MINIO_ROOT_USER:-gart_minio}' '${MINIO_ROOT_PASSWORD}'
        && mc mb --ignore-existing local/gart-media

  # Queue backend for notification delivery. The API degrades gracefully when
  # this is down: in-app notifications are written to Postgres regardless, and
  # only asynchronous push delivery waits for Redis to come back.
  redis:
    image: redis:7-alpine
    container_name: gart_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-16379}:6379'
    volumes:
      - gart_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gart_postgres_data:
  gart_minio_data:
  gart_redis_data:
